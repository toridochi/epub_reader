<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>My Digital Library</title>
    <link rel="stylesheet" href="style.css">

    <script src="js/jszip.min.js"></script>
    <script src="js/epub.min.js"></script>
</head>

<body>

<header class="home-header">
    <h1>📚 My Digital Library</h1>

    <div class="header-tools">
        <input id="searchInput" class="search-box" type="text" placeholder="Search books...">
        <button id="themeToggle">🌙</button>
    </div>
</header>

<div id="book-grid" class="book-grid">
    <div class="loading">Loading books...</div>
</div>

<script>
// ===============================
// CONFIG — GITHUB
// ===============================
const GH_USER = "toridochi";
const GH_REPO = "epub_reader";
const GH_BRANCH = "main";

const API_URL =
  `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/books?ref=${GH_BRANCH}`;

// Dark mode toggle
document.getElementById("themeToggle").onclick = () => {
    document.body.classList.toggle("dark");
};

// ===============================
// FETCH BOOK LIST FROM GITHUB
// ===============================
async function loadBooks() {
    const grid = document.getElementById("book-grid");
    grid.innerHTML = "<div class='loading'>Fetching books...</div>";

    try {
        const response = await fetch(API_URL);
        const files = await response.json();

        const epubFiles = files.filter(f => f.name.endsWith(".epub"));

        displayBooks(epubFiles);
    } catch (err) {
        console.error(err);
        grid.innerHTML = "<div class='error'>Failed to load books</div>";
    }
}

loadBooks();

// ==========================================================
// ========== COVER CACHING + LAZY LOADING FUNCTION ==========
// ==========================================================
async function loadCoverWithCache(card, epubUrl) {
    const img = card.querySelector(".lazy-cover");
    const cacheKey = "cover_" + epubUrl;

    // ⏳ Load from cache instantly
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
        img.src = cached;
        return;
    }

    // 🎨 If no cache → extract cover from EPUB
    try {
        const book = ePub(epubUrl);
        const coverUrl = await book.coverUrl();

        if (coverUrl) {
            const blob = await fetch(coverUrl).then(r => r.blob());
            const reader = new FileReader();

            reader.onloadend = () => {
                const base64 = reader.result;
                localStorage.setItem(cacheKey, base64);
                img.src = base64;
            };

            reader.readAsDataURL(blob);
        } else {
            img.src = "default_cover.png";
        }
    } catch (e) {
        img.src = "default_cover.png";
    }
}

// ===============================
// DISPLAY BOOK CARDS + LAZY LOADING
// ===============================
async function displayBooks(files) {
    const grid = document.getElementById("book-grid");
    grid.innerHTML = "";

    // Lazy loading observer
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
            if (e.isIntersecting) {
                const card = e.target;
                const epubUrl = card.dataset.epub;
                loadCoverWithCache(card, epubUrl);
                observer.unobserve(card);
            }
        });
    }, { rootMargin: "200px" });

    // Create cards
    files.forEach(file => {
        const cleanName = file.name.replace(/_/g, " ");
        const epubUrl = file.download_url;

        const div = document.createElement("div");
        div.className = "book-card-2";
        div.dataset.name = cleanName.toLowerCase();
        div.dataset.epub = epubUrl;

        div.innerHTML = `
            <div class="book-cover-2">
                <img data-src="${epubUrl}" src="default_cover.png" class="lazy-cover">
            </div>
            <div class="book-title-2">${cleanName}</div>
            <a class="read-btn-2" href="reader.html?src=${encodeURIComponent(epubUrl)}">Read</a>
        `;

        grid.appendChild(div);
        observer.observe(div);
    });
}

// ===============================
// SEARCH
// ===============================
document.getElementById("searchInput").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    const items = document.querySelectorAll(".book-card-2");

    items.forEach(card => {
        const name = card.dataset.name;
        card.style.display = name.includes(q) ? "block" : "none";
    });
});
</script>

</body>
</html>
