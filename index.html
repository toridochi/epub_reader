<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>My Digital Library</title>
    <link rel="stylesheet" href="style.css">

    <script src="js/jszip.min.js"></script>
    <script src="js/epub.min.js"></script>
</head>

<body>

<header class="home-header premium-header">
    <h1>📚 My Digital Library</h1>

    <div class="header-tools">
        <input id="searchInput" class="search-box" type="text" placeholder="Search books...">
        <button id="themeToggle">🌙</button>
    </div>
</header>

<!-- HERO BANNER -->
<div class="hero">
    <div class="hero-content">
        <h2>Kho sách cá nhân của <strong>Hồ Anh Nhựt</strong></h2>
        <p>Nơi lưu trữ và thưởng thức những cuốn sách yêu thích – mọi lúc, mọi nơi.</p>
    </div>
</div>

<!-- FEATURED SECTION -->
<section class="section">
    <h3 class="section-title">⭐ Featured Books</h3>
    <div id="featured-grid" class="featured-grid"></div>
</section>

<!-- RECENTLY ADDED -->
<section class="section">
    <h3 class="section-title">🆕 Recently Added</h3>
    <div id="recent-grid" class="recent-grid"></div>
</section>

<!-- ALL BOOKS -->
<section class="section">
    <h3 class="section-title">📘 All Books</h3>
    <div id="book-grid" class="book-grid"></div>
</section>

<!-- FOOTER -->
<footer class="footer">
    <div class="footer-inner">
        <span>📘 Kho sách của <strong>Hồ Anh Nhựt</strong></span>
        <span class="dot"></span>
        <span>Made with ❤️ for reading</span>
    </div>
</footer>

<script>
// ===============================
// CONFIG
// ===============================
const GH_USER = "toridochi";
const GH_REPO = "epub_reader";
const GH_BRANCH = "main";

const API_URL = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/books?ref=${GH_BRANCH}`;

document.getElementById("themeToggle").onclick = () => {
    document.body.classList.toggle("dark");
};

// ===============================
// LOAD BOOKS
// ===============================
async function loadBooks() {
    try {
        const response = await fetch(API_URL);
        let files = await response.json();

        files = files.filter(f => f.name.endsWith(".epub"));

        // For sections:
        const featured = files.slice(0, 3);
        const recent = files.slice(-3);

        displayBooks(featured, "featured-grid");
        displayBooks(recent, "recent-grid");
        displayBooks(files, "book-grid");
    } catch (err) {
        console.error(err);
    }
}

loadBooks();

// ===============================
// DISPLAY BOOK CARDS (Premium)
// ===============================
async function displayBooks(files, containerId) {
    const grid = document.getElementById(containerId);
    grid.innerHTML = "";

    for (let file of files) {
        const cleanName = file.name.replace(/_/g, " ");
        const epubUrl = file.download_url;

        // Skeleton effect before image loads
        const skeleton = document.createElement("div");
        skeleton.className = "book-card skeleton";
        grid.appendChild(skeleton);

        // Load cover
        let coverImage = "default_cover.png";
        try {
            const book = ePub(epubUrl);
            const cover = await book.coverUrl();
            if (cover) coverImage = cover;
        } catch {}

        // Create actual card
        const div = document.createElement("div");
        div.className = "book-card";
        div.dataset.name = cleanName.toLowerCase();

        div.innerHTML = `
            <div class="book-cover">
                <img loading="lazy" src="${coverImage}" onerror="this.src='default_cover.png'">
            </div>
            <div class="book-info">
                <div class="book-title">${cleanName}</div>
                <a class="read-btn" href="reader.html?src=${encodeURIComponent(epubUrl)}">Read →</a>
            </div>
        `;

        // Replace skeleton
        grid.replaceChild(div, skeleton);
    }
}

// ===============================
// SEARCH
// ===============================
document.getElementById("searchInput").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    const items = document.querySelectorAll(".book-card");

    items.forEach(card => {
        card.style.display = card.dataset.name.includes(q) ? "block" : "none";
    });
});
</script>

</body>
</html>
