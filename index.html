<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Digital Library</title>
<link rel="stylesheet" href="style.css" />

<!-- JSZip + EPUB for cover extraction -->
<script src="js/jszip.min.js"></script>
<script src="js/epub.min.js"></script>

<!-- Default cover fallback -->
<style>
.default-cover {
    width: 100%;
    height: 240px;
    border-radius: 10px;
    background: url("default_cover.png") center/cover no-repeat;
}
</style>
</head>

<body>
<header>
    <h1>📚 My Digital Library</h1>
</header>

<div id="books-container" class="books-grid">Loading books...</div>

<script>
const user = "toridochi";
const repo = "epub_reader";
const branch = "main";
const booksFolder = "books";

async function fetchBooks() {
    const apiURL = `https://api.github.com/repos/${user}/${repo}/contents/${booksFolder}?ref=${branch}`;

    const response = await fetch(apiURL);
    const files = await response.json();

    const epubFiles = files.filter(f => f.name.endsWith(".epub"));
    renderBooks(epubFiles);
}

function renderBooks(list) {
    const container = document.getElementById("books-container");
    container.innerHTML = "";

    list.forEach(async (file) => {
        const fileURL = `https://raw.githubusercontent.com/${user}/${repo}/${branch}/${booksFolder}/${file.name}`;

        // Try to get cover image from EPUB
        let coverSrc = await extractCover(fileURL);

        const card = document.createElement("div");
        card.className = "book-card";

        card.innerHTML = `
            <div class="cover-box">
                ${
                    coverSrc
                        ? `<img src="${coverSrc}" class="cover-img" />`
                        : `<div class="default-cover"></div>`
                }
            </div>
            <h3>${file.name}</h3>
            <button onclick="location.href='reader.html?file=${encodeURIComponent(file.name)}'">
                Read
            </button>
        `;

        container.appendChild(card);
    });
}

async function extractCover(epubURL) {
    try {
        const data = await fetch(epubURL).then(r => r.arrayBuffer());
        const book = await ePub(data);
        const coverURL = await book.coverUrl();

        return coverURL;
    } catch (e) {
        return null;
    }
}

fetchBooks();
</script>

</body>
</html>
