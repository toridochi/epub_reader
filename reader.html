<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EPUB Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<!-- EPUB.js -->
<script src="js/jszip.min.js"></script>
<script src="js/epub.min.js"></script>

<style>
/* Reader layout */
#viewer {
    width: 100%;
    height: calc(100vh - 60px);
    margin-top: 60px;
    overflow: hidden;
}

.reader-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 55px;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    padding: 10px 15px;
    z-index: 20;
}

.reader-header .back-btn {
    padding: 8px 12px;
    background: #007bff;
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    margin-right: 15px;
    font-size: 14px;
}

.reader-header h2 {
    font-size: 18px;
    margin: 0;
    flex: 1;
}

#progressBar {
    height: 3px;
    width: 0%;
    background: #007bff;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="reader-header">
    <a class="back-btn" href="index.html">← Back</a>
    <h2 id="book-title">Loading...</h2>
</div>

<div id="progressBar"></div>

<!-- VIEWPORT FOR EPUB -->
<div id="viewer"></div>

<script>
// =============== READ EPUB FROM URL PARAM ===============
const params = new URLSearchParams(window.location.search);
const fileUrl = params.get("src");

if (!fileUrl) {
    alert("Missing 'src' parameter");
}

// Extract filename for title
const fileName = decodeURIComponent(fileUrl.split("/").pop());
document.getElementById("book-title").textContent = fileName;

// Storage key for saving progress
const saveKey = "pos_" + fileName;

// =============== INIT EPUB BOOK ===============
const book = ePub(fileUrl);
const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%",
    flow: "paginated"
});

// Load saved position
let savedPos = localStorage.getItem(saveKey);
rendition.display(savedPos || undefined);

// Save reading progress
rendition.on("relocated", (location) => {
    localStorage.setItem(saveKey, location.start.cfi);

    if (book.locations.length) {
        const percent = book.locations.percentageFromCfi(location.start.cfi);
        document.getElementById("progressBar").style.width = (percent * 100) + "%";
    }
});

// Generate locations for % bar
book.ready.then(() => book.locations.generate(1500));

// =============== KEYBOARD NAV (← →) ===============
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") rendition.next();
    if (e.key === "ArrowLeft") rendition.prev();
});

// =============== CLICK NAV (LEFT / RIGHT SIDE) ===============
document.getElementById("viewer").addEventListener("click", function (e) {
    const x = e.clientX;

    if (x > window.innerWidth * 0.6) {
        rendition.next();     // Click right → next page
    } else if (x < window.innerWidth * 0.4) {
        rendition.prev();     // Click left → prev page
    }
});
</script>

</body>
</html>
