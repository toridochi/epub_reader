<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EPUB Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<script src="js/jszip.min.js"></script>
<script src="js/epub.min.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
}

/* Top header */
.reader-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 55px;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    padding: 10px 15px;
    z-index: 10;
}

.reader-header .back-btn {
    padding: 8px 12px;
    background: #007bff;
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    margin-right: 15px;
    font-size: 14px;
}

#progressBar {
    height: 3px;
    width: 0%;
    background: #007bff;
    margin-top: 55px;
}

/* AREA DISPLAY EPUB */
#viewer {
    position: fixed;
    top: 58px;
    left: 0;
    width: 100%;
    height: calc(100vh - 58px);
    overflow: hidden;
    background: #fdfdfd;
}

/* Invisible click zones */
.nav-area {
    position: fixed;
    top: 58px;
    width: 50%;
    height: calc(100vh - 58px);
    z-index: 15;
}

#prevArea { left: 0; }
#nextArea { right: 0; }

#prevArea:hover, #nextArea:hover {
    background: rgba(0,0,0,0.02);
}
</style>
</head>

<body>

<div class="reader-header">
    <a class="back-btn" href="index.html">← Back</a>
    <h2 id="book-title">Loading...</h2>
</div>

<div id="progressBar"></div>

<div id="viewer"></div>

<div id="prevArea" class="nav-area"></div>
<div id="nextArea" class="nav-area"></div>

<script>
/* -------------------------
   LOAD EPUB SOURCE
-------------------------- */
const params = new URLSearchParams(window.location.search);
const fileUrl = params.get("src");

if (!fileUrl) {
    document.body.innerHTML = "<h2>Missing EPUB source</h2>";
    throw new Error("Missing src param");
}

const fileName = decodeURIComponent(fileUrl.split("/").pop());
document.getElementById("book-title").textContent = fileName;

const saveKey = "pos_" + fileName;

/* -------------------------
   INIT EPUB
-------------------------- */
const book = ePub(fileUrl);

const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%",
    spread: "auto",
    flow: "paginated",
    allowScriptedContent: true
});

/* Restore last position */
let saved = localStorage.getItem(saveKey);
rendition.display(saved || undefined);

/* Save progress */
rendition.on("relocated", (loc) => {
    localStorage.setItem(saveKey, loc.start.cfi);

    if (book.locations.length) {
        let pct = book.locations.percentageFromCfi(loc.start.cfi);
        document.getElementById("progressBar").style.width = (pct * 100) + "%";
    }
});

/* Generate locations */
book.ready.then(() => book.locations.generate(1500));

/* -------------------------
   PAGE NAVIGATION
-------------------------- */
document.getElementById("prevArea").onclick = () => rendition.prev();
document.getElementById("nextArea").onclick = () => rendition.next();

/* Keyboard arrows */
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") rendition.next();
    if (e.key === "ArrowLeft") rendition.prev();
});
</script>

</body>
</html>
