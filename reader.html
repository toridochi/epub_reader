<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EPUB Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<!-- EPUB.js -->
<script src="js/jszip.min.js"></script>
<script src="js/epub.min.js"></script>

<style>

/* ===================== GLOBAL ====================== */
body {
    margin: 0;
    padding: 0;
    font-family: "Inter", sans-serif;
    background: var(--bg, #ffffff);
    color: var(--text, #000000);
    transition: background 0.3s;
}

/* ===================== HEADER ====================== */
.reader-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 55px;
    background: var(--header-bg, #ffffff);
    color: var(--text);
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    padding: 8px 15px;
    z-index: 20;
}

.back-btn {
    padding: 8px 12px;
    background: #007bff;
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
    margin-right: 15px;
}

.dark .reader-header {
    background: #1c1c1e;
    border-bottom: 1px solid #444;
}

#book-title {
    flex: 1;
    font-size: 16px;
    font-weight: 600;
}

/* TOC button */
#tocBtn {
    padding: 6px 10px;
    border-radius: 6px;
    background: #eee;
    cursor: pointer;
    font-size: 14px;
}
.dark #tocBtn {
    background: #333;
    color: #fff;
}

/* DARK MODE BUTTON */
#darkModeToggle {
    margin-left: 10px;
    cursor: pointer;
    font-size: 18px;
}

/* ===================== TOC PANEL ====================== */
#tocPanel {
    position: fixed;
    right: -300px;
    top: 55px;
    width: 260px;
    height: calc(100vh - 55px);
    overflow-y: auto;
    background: var(--header-bg, #fff);
    border-left: 1px solid #ccc;
    transition: 0.3s;
    padding: 10px;
    z-index: 30;
}

.dark #tocPanel {
    background: #1c1c1e;
    border-left: 1px solid #444;
}

/* ===================== VIEWER ====================== */
#viewer {
    position: fixed;
    top: 55px;
    left: 0;
    width: 100%;
    height: calc(var(--vh, 1vh) * 100 - 55px); /* <-- MOBILE FIX */
    overflow: hidden;
    background: var(--bg, #ffffff);
}

.dark {
    --bg: #1c1c1e;
    --text: #e5e5ea;
    --header-bg: #2c2c2e;
}

/* Navigation click zones */
.nav-area {
    position: fixed;
    top: 55px;
    width: 50%;
    height: calc(100vh - 55px);
    z-index: 10;
}

#prevArea { left: 0; }
#nextArea { right: 0; }

</style>
</head>

<body>

<!-- ===================== HEADER ====================== -->
<div class="reader-header">
    <a class="back-btn" href="index.html">← Back</a>
    <div id="book-title">Loading...</div>

    <button id="tocBtn">📘 TOC</button>
    <span id="darkModeToggle">🌙</span>
</div>

<!-- ===================== TOC PANEL ====================== -->
<div id="tocPanel"></div>

<!-- ===================== VIEWPORT ====================== -->
<div id="viewer"></div>

<!-- NAVIGATION ZONES -->
<div id="prevArea" class="nav-area"></div>
<div id="nextArea" class="nav-area"></div>

<script>
/* ===========================================================
    MOBILE VIEWPORT FIX (100vh bug)
=========================================================== */
function updateVH() {
    document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px");
}
updateVH();
window.addEventListener("resize", updateVH);
window.addEventListener("orientationchange", updateVH);

/* ===========================================================
    LOAD EPUB FILE
=========================================================== */
const params = new URLSearchParams(window.location.search);
const fileUrl = params.get("src");

if (!fileUrl) alert("Missing 'src' parameter");

const fileName = decodeURIComponent(fileUrl.split("/").pop());
document.getElementById("book-title").textContent = fileName;

// Storage key for bookmark
const saveKey = "pos_" + fileName;

const book = ePub(fileUrl);

const rendition = book.renderTo("viewer", {
    flow: "paginated",
    width: "100%",
    height: "100%"
});

// Load saved position
let saved = localStorage.getItem(saveKey);
rendition.display(saved || undefined);

// Save each movement
rendition.on("relocated", function (loc) {
    localStorage.setItem(saveKey, loc.start.cfi);
});

/* ===========================================================
    TOC PANEL
=========================================================== */
book.ready.then(() => {
    return book.loaded.navigation;
}).then(toc => {
    const panel = document.getElementById("tocPanel");
    panel.innerHTML = "";

    toc.toc.forEach(ch => {
        let div = document.createElement("div");
        div.style.padding = "6px 0";
        div.style.cursor = "pointer";
        div.textContent = ch.label;

        div.onclick = () => {
            rendition.display(ch.href);
            panel.style.right = "-300px";
        };

        panel.appendChild(div);
    });
});

// TOC Toggle
document.getElementById("tocBtn").onclick = () => {
    const panel = document.getElementById("tocPanel");
    panel.style.right = panel.style.right === "0px" ? "-300px" : "0px";
};

/* ===========================================================
    DARK MODE
=========================================================== */
document.getElementById("darkModeToggle").onclick = () => {
    document.body.classList.toggle("dark");

    // apply dark mode inside EPUB iframe
    try {
        const contents = rendition.getContents();
        contents.forEach(c => {
            c.addStylesheetRules({
                "body": { "background": "#1c1c1e", "color": "#e5e5ea" }
            });
        });
    } catch(e){}
};

/* ===========================================================
    CLICK NAVIGATION
=========================================================== */
document.getElementById("prevArea").onclick = () => rendition.prev();
document.getElementById("nextArea").onclick = () => rendition.next();

/* ===========================================================
    SWIPE NAVIGATION (MOBILE)
=========================================================== */
let touchStartX = 0;

document.getElementById("viewer").addEventListener("touchstart", e => {
    touchStartX = e.changedTouches[0].screenX;
});

document.getElementById("viewer").addEventListener("touchend", e => {
    let endX = e.changedTouches[0].screenX;
    if (endX - touchStartX > 80) rendition.prev();
    if (touchStartX - endX > 80) rendition.next();
});
</script>

</body>
</html>
